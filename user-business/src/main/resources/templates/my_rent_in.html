<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Rentals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/plugins/bootstrap-3.3.7/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/my_rent_in.css}">
</head>
<body>
<div class="container">
    <div class="page-header text-center">
        <h2 class="text-primary"><em>My Rentals</em></h2>
    </div>
    <div class="btn-group pull-right">
        <button class="btn btn-primary glyphicon glyphicon-th" data-toggle="dropdown" title="Columns">
            <span class="caret"></span>
        </button>
        <ul class="dropdown-menu" id="dropdownMenu1">
            <!--<li>
                <label>
                    <input type="checkbox" checked="checked">ID
                </label>
            </li>-->
        </ul>
        <button class="btn btn-warning glyphicon glyphicon-refresh" id="refreshBtn" title="Refresh"></button>
    </div>
    <div class="table-responsive" id="tableBlock">
        <table class="table table-striped table-hover table-condensed">
            <thead>
            <tr>
                <th></th>
                <th><input type="checkbox" title="Select All" id="selectAllCheckBox"/></th>
                <th>ID</th>
                <th>Item Name</th>
                <th>Application Time</th>
                <th>Approval Time</th>
                <th>Payment Time</th>
                <th>Rental Days</th>
                <th>Return Time</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vo, stat: ${personalItemVOList}">
                <input name="inputItemId" type="hidden" th:value="${vo.itemId}"/>
                <td class="text-center">
                    <span class="detail glyphicon glyphicon-plus" title="Details"></span>
                </td>
                <td><input type="checkbox" class="single-checkbox" title="select"></td>
                <td th:utext="${stat.index + 1}"></td>
                <td th:utext="${vo.getStuffName()}"></td>
                <td th:utext="${vo.applyTime}"></td>
                <td th:utext="${vo.approvalTime}"></td>
                <td th:utext="${vo.payTime}"></td>
                <td th:utext="${vo.rentDay}"></td>
                <td th:utext="${vo.endTime}"></td>
                <td th:utext="${vo.status.getName()}"></td>
                <td th:switch="${vo.status.getValue()}">
                    <div th:case="0">
                        <a href="javascript:void(0)" class="btn btn-primary cancelApplyBtn">Cancel Application</a>
                    </div>
                    <div th:case="2">
                        <a href="javascript:void(0)" class="btn btn-primary payBtn">Pay</a>
                    </div>
                    <div th:case="3">
                        <a href="javascript:void(0)" class="btn btn-primary ratingBtn" data-toggle="modal"
                           data-target="#ratingModal">Rating</a>
                    </div>
                </td>
<!--                <td th:if="${vo.status.getValue() > 2}" class="btn btn-primary ratingBtn">
                    <button  class="btn btn-primary ratingBtn" data-toggle="modal"
                       data-target="#ratingModal">Rating</button>
                </td>-->
            </tr>
            </tbody>
        </table>
    </div>
    <nav class="text-center">
        <ul class="pagination">
            <li class="previous"><a href="#"><span>&laquo;</span></a></li>
            <li class="active number"><a href="#">1</a></li>
            <li class="number"><a href="#">2</a></li>
            <li class="number"><a href="#">3</a></li>
            <li class="number"><a href="#">4</a></li>
            <li class="number"><a href="#">5</a></li>
            <li class="number"><a href="#">6</a></li>
            <li class="next"><a href="#"><span>&raquo;</span></a></li>
        </ul>
    </nav>
</div>
<!--rating modal-->
<div class="modal fade" id="ratingModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
                <h4 class="modal-title">Rating</h4>
            </div>
            <div class="modal-body">
                <form id="ratingForm" class="form-horizontal">
                    <div class="form-group">
                        <label for="inputScore" class="col-sm-2 control-label">Rating</label>
                        <div class="col-sm-3">
                            <input id="inputScore" name="score" class="form-control" placeholder="Rating"
                                   title="Rating" autofocus required/>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="ratingSubmitBtn">Submit</button>
            </div>
        </div>
    </div>
</div>

<!--hint modal-->
<div class="modal fade" id="hintModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
                <h4 class="modal-title">Information</h4>
            </div>
            <div class="modal-body">
                <h5><span id="hintContent"></span></h5>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/plugins/jquery-3.2.1/jquery-3.2.1.min.js}"></script>
<script th:src="@{/plugins/bootstrap-3.3.7/js/bootstrap.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/my_rent_in.js}"></script>
</body>
</html>

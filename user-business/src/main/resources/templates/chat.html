<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/plugins/mdui-v0.4.2/css/mdui.min.css}">
</head>
<body class="mdui-theme-primary-indigo mdui-theme-accent-pink">

<div class="mdui-container">
    <div class="mdui-toolbar mdui-color-theme">
        <a class="mdui-btn mdui-btn-icon"><i class="mdui-icon material-icons">menu</i></a>
        <span class="mdui-typo-title">rent Chat Room</span>
        <div class="mdui-toolbar-spacer"></div>
        <a class="mdui-btn mdui-btn-icon"><i class="mdui-icon material-icons">more_vert</i></a>
    </div>
</div>

<div>
    <div class="mdui-container container_text">

        <div class="mdui-row">
            <div class="mdui-col-xs-12 mdui-col-sm-6">
                <div class="mdui-col-xs-12 mdui-col-sm-10">
                    <div class="mdui-textfield-floating-label" style="margin-top:15px">
                        <i class="mdui-icon" id="username" th:text="${username}"></i>
                        <i class="mdui-icon material-icons">，Welcome</i>
                    </div>
                </div>
                <div class="mdui-col-xs-12 mdui-col-sm-10">
                    <div class="mdui-textfield mdui-textfield-floating-label">
                        <i class="mdui-icon material-icons">textsms</i>
                        <label class="mdui-textfield-label">Message</label>
                        <input class="mdui-textfield-input" id="msg"/>
                    </div>
                    <div class="mdui-container" style="padding:20px 35px">
                        <button class="mdui-btn mdui-color-theme-accent mdui-ripple"
                                onclick="sendMsgToServer()">Send
                        </button>
                        <button class="mdui-btn mdui-color-theme mdui-ripple"
                                onclick="clearMsg()">Clear
                        </button>
                    </div>
                </div>
            </div>

            <div class="mdui-col-xs-6 mdui-col-sm-5" style="padding:10px 0">
                <div class="mdui-chip">
                    <span class="mdui-chip-icon mdui-color-blue">
                        <i class="mdui-icon material-icons">&#xe420;</i></span>
                    <span class="mdui-chip-title">Chat Messages</span>
                </div>

                <div class="mdui-chip">
                    <span class="mdui-chip-icon mdui-color-blue">
                        <i class="mdui-icon material-icons">face</i></span>
                    <span class="mdui-chip-title">Users Online</span>
                    <span class="mdui-chip-title chat-num">0</span>
                </div>
                <div class="message-container">

                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    /**
     * WebSocket client
     *
     * Usage:
     * 1. The WebSocket client receives server messages through callbacks, for example webSocket.onmessage.
     * 2. The WebSocket client sends messages with the send method, for example webSocket.send().
     */
    function getWebSocket() {
        /**
         * The URL starts with the WebSocket scheme, followed by host and port, and ends with the server endpoint
         */
        var webSocket = new WebSocket([[${webSocketUrl}]]);
        console.log([[${webSocketUrl}]])
        /**
         * When the server opens the connection
         */
        webSocket.onopen = function (event) {
            console.log('WebSocket connection opened');
        };

        /**
         * When the server sends a message: broadcast it and update the online-user count
         */
        webSocket.onmessage = function (event) {
            console.log('WebSocket message received: %c' + event.data, 'color:green');
            //Read the server message
            var message = JSON.parse(event.data) || {};
            var $messageContainer = $('.message-container');
            //
            if (message.type === 'SPEAK') {
                $messageContainer.append(
                    '<div class="mdui-card" style="margin: 10px 0;">' +
                    '<div class="mdui-card-primary">' +
                    '<div class="mdui-card-content message-content">' + message.username + "：" + message.msg + '</div>' +
                    '</div></div>');
            }
            $('.chat-num').text(message.onlineCount);
            //Prevent message flooding
            var $cards = $messageContainer.children('.mdui-card:visible').toArray();
            if ($cards.length > 5) {
                $cards.forEach(function (item, index) {
                    index < $cards.length - 5 && $(item).slideUp('fast');
                });
            }
        };

        /**
         * Close the connection
         */
        webSocket.onclose = function (event) {
            console.log('WebSocket connection closed');
        };

        /**
         * Communication error
         */
        webSocket.onerror = function (event) {
            console.log('WebSocket error');

        };
        return webSocket;
    }

    var webSocket = getWebSocket();


    /**
     * Send a message to the server through the WebSocket object
     */
    function sendMsgToServer() {
        var $message = $('#msg');
        if ($message.val()) {
            webSocket.send(JSON.stringify({username: $('#username').text(), msg: $message.val()}));
            $message.val(null);
        }

    }

    /**
     * Clear
     */
    function clearMsg() {
        $(".message-container").empty();
    }

    /**
     * Press Enter to send a message
     */
    document.onkeydown = function (event) {
        var e = event || window.event || arguments.callee.caller.arguments[0];
        e.keyCode === 13 && sendMsgToServer();
    };
</script>
<script th:src="@{/plugins/jquery-3.2.1/jquery-3.2.1.min.js}"></script>
<script th:src="@{/plugins/mdui-v0.4.2/js/mdui.min.js}"></script>
</body>
</html>

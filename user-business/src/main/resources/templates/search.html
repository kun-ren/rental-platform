<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/plugins/bootstrap-3.3.7/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="container">
    <div class="page-header text-center">
        <h2 class="text-primary"><em>Search</em></h2>
    </div>
    <div class="btn-group">
        <form th:action="@{/stuffs/search}" th:method="post">
            <label for="inputName">Item Name：</label><input name="name" th:value="${nameCondition}" id="inputName"/>
            <label for="inputDesc">Item description：</label><input name="desc" th:value="${descCondition}" id="inputDesc"/>
            <label for="categorySelect">Category:</label>
            <select id="categorySelect" name="categoryId">
                <option value="" selected>Select</option>
                <option th:value="${categorySelectVo.id}" th:utext="${categorySelectVo.name}"
                        th:each="categorySelectVo: ${categorySelectVoList}"></option>
            </select>
            <button class="button">Search</button>
        </form>
    </div>
    <div class="btn-group pull-right">
        <button class="btn btn-primary glyphicon glyphicon-th" data-toggle="dropdown" title="Columns">
            <span class="caret"></span>
        </button>
        <ul class="dropdown-menu" id="dropdownMenu1">
            <!--<li>
                <label>
                    <input type="checkbox" checked="checked">ID
                </label>
            </li>-->
        </ul>
        <button class="btn btn-warning glyphicon glyphicon-refresh" id="refreshBtn" title="Refresh"></button>
    </div>
    <div class="table-responsive" id="tableBlock">
        <table class="table table-striped table-hover table-condensed">
            <thead>
            <tr>
                <th></th>
                <th>ID</th>
                <th>Category Name</th>
                <th>Item Name</th>
                <th>Item description</th>
                <th>Deposit</th>
                <th>Rental (RMB/day)</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vo, stat: ${stuffSearchVoList}">
                <td class="text-center">
                    <span class="detail glyphicon glyphicon-plus" title="Details"></span>
                </td>
                <td th:utext="${stat.index + 1}"></td>
                <td th:utext="${vo.categoryName}"></td>
                <td th:utext="${vo.getStuffName()}"></td>
                <td th:utext="${vo.stuffDescription}"></td>
                <td th:utext="${vo.deposit}"></td>
                <td th:utext="${vo.rental}"></td>
                <td th:utext="${vo.status.getName()}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <!--<nav class="text-center">-->
    <!--<ul class="pagination">-->
    <!--<li class="previous"><a href="#"><span>&laquo;</span></a></li>-->
    <!--<li class="active number"><a href="#">1</a></li>-->
    <!--<li class="number"><a href="#">2</a></li>-->
    <!--<li class="number"><a href="#">3</a></li>-->
    <!--<li class="number"><a href="#">4</a></li>-->
    <!--<li class="number"><a href="#">5</a></li>-->
    <!--<li class="number"><a href="#">6</a></li>-->
    <!--<li class="next"><a href="#"><span>&raquo;</span></a></li>-->
    <!--</ul>-->
    <!--</nav>-->
</div>
<script th:src="@{/plugins/jquery-3.2.1/jquery-3.2.1.min.js}"></script>
<script th:src="@{/plugins/bootstrap-3.3.7/js/bootstrap.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/search.js}"></script>
</body>
</html>
